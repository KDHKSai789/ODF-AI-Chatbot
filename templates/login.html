<!DOCTYPE html>
<html>
<head>
    <title>ODF AI Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-box">
    <h1>ODF AI</h1>
    <h2>COMMAND CENTER</h2>

        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
    </form>
</div>
</body>
</html>
